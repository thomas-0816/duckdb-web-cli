name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write # release upload
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04-arm
    env:
      VERSION: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      MATRIX_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build and Upload
        run: |
          set -euo pipefail
          if [[ "$MATRIX_OS" == "ubuntu-22.04" ]]; then
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update
            sudo apt-get install -y libvulkan-dev spirv-headers vulkan-sdk
          else
            sudo apt-get update
            sudo apt-get install -y libvulkan-dev spirv-headers glslc
          fi
          make
          case "${RUNNER_ARCH}" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          name="duckdb-web-cli-linux-${arch}"
          mkdir -p "dist/${name}"
          cp build/release/docs duckdb-docs.md duckdb-blog.md LICENSE README.md \
            semantic-bge-small-en-v1.5-q8_0.hnsw semantic-bge-small-en-v1.5-q8_0.meta \
            "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          gh release upload "${VERSION}" "dist/${name}.tar.gz" --repo "${GITHUB_REPOSITORY}" --clobber

  macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write # release upload
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    env:
      DOCS_GPU_LAYERS: 0 # GitHub's macOS runners use a paravirtual Metal device, so keep inference on CPU
      VERSION: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build and Upload
        run: |
          set -euo pipefail
          make
          case "${RUNNER_ARCH}" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          name="duckdb-web-cli-macos-${arch}"
          mkdir -p "dist/${name}"
          cp build/release/docs \
            duckdb-docs.md duckdb-blog.md LICENSE README.md \
            semantic-bge-small-en-v1.5-q8_0.hnsw semantic-bge-small-en-v1.5-q8_0.meta \
            "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          gh release upload "${VERSION}" "dist/${name}.tar.gz" --repo "${GITHUB_REPOSITORY}" --clobber

  windows:
    name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write # release upload
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-11-arm
    env:
      VULKAN_VERSION: 1.4.357.0
      CMAKE_GENERATOR: Ninja
      VERSION: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -e
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            sdk_os=warm
            sdk_arch=ARM64
          else
            sdk_os=windows
            sdk_arch=X64
          fi
          curl.exe -L -o "$RUNNER_TEMP/VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/${sdk_os}/vulkansdk-windows-${sdk_arch}-${VULKAN_VERSION}.exe"
          status=0
          $RUNNER_TEMP/VulkanSDK-Installer.exe --accept-licenses --default-answer --confirm-command install || status=$?
          if [[ $status -ne 0 && $status -ne 3010 ]]; then
            echo "Vulkan SDK installer failed with exit code $status" >&2
            exit "$status"
          fi
          echo "VULKAN_SDK=C:\\VulkanSDK\\${VULKAN_VERSION}" >> "$GITHUB_ENV"
          echo "C:\\VulkanSDK\\${VULKAN_VERSION}\\bin" >> "$GITHUB_PATH"
      - name: Build and Upload
        shell: bash
        run: |
          set -euo pipefail
          # Git Bash puts its own MinGW runtime first, which does not match the
          # compiler used by the Windows LLVM toolchain.
          export PATH="/c/mingw64/bin:$PATH"
          make
          case "${RUNNER_ARCH}" in
            X64) arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "unsupported architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          name="duckdb-web-cli-windows-${arch}"
          mkdir -p "dist/${name}"
          cp build/release/docs.exe duckdb-docs.md duckdb-blog.md LICENSE README.md \
            semantic-bge-small-en-v1.5-q8_0.hnsw semantic-bge-small-en-v1.5-q8_0.meta \
            "dist/${name}/"
          system_root="${SYSTEMROOT:-C:\\Windows}"
          vulkan_loader="$(cygpath -u "$system_root")/System32/vulkan-1.dll"
          if [[ ! -f "$vulkan_loader" ]]; then
            echo "Vulkan loader not found at $vulkan_loader" >&2
            exit 1
          fi
          vulkan_loader_win="$system_root\\System32\\vulkan-1.dll"
          machine="$(powershell.exe -NoProfile -Command "\$b=[IO.File]::ReadAllBytes('$vulkan_loader_win'); \$p=[BitConverter]::ToInt32(\$b,0x3c); '{0:X4}' -f [BitConverter]::ToUInt16(\$b,\$p+4)" | tr -d '\r')"
          if [[ "$arch" == "arm64" ]]; then
            expected_machine=AA64
          else
            expected_machine=8664
          fi
          if [[ "$machine" != "$expected_machine" ]]; then
            echo "Vulkan loader at $vulkan_loader has machine type $machine, expected $expected_machine" >&2
            exit 1
          fi
          cp "$vulkan_loader" "dist/${name}/"
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          if [[ ! -x "$vswhere" ]]; then
            echo "vswhere not found at $vswhere" >&2
            exit 1
          fi
          vs_path="$("$vswhere" -latest -products '*' -property installationPath)"
          vs_path="$(cygpath -u "$vs_path")"
          crt_dir="$(find "$vs_path/VC/Redist/MSVC" -type d -path "*/${arch}/Microsoft.VC*.CRT" 2>/dev/null | sort | tail -1)"
          if [[ -z "$crt_dir" ]]; then
            echo "MSVC runtime not found under $vs_path" >&2
            exit 1
          fi
          cp "$crt_dir"/msvcp140*.dll "$crt_dir"/vcruntime140*.dll "$crt_dir"/concrt140.dll "dist/${name}/"
          for dll in vulkan-1.dll msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            if [[ ! -f "dist/${name}/${dll}" ]]; then
              echo "missing runtime dependency: ${dll}" >&2
              exit 1
            fi
          done
          DOCS_STAGE="dist/${name}" powershell.exe -NoProfile -Command \
            "Compress-Archive -Path \$env:DOCS_STAGE -DestinationPath (\$env:DOCS_STAGE + '.zip') -Force"
          gh release upload "${VERSION}" "dist/${name}.zip" --repo "${GITHUB_REPOSITORY}" --clobber

  clamav:
    name: "Docker: clamAV"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [linux, macos, windows]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container and run clamAV
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -p "*" -D . -R "${GITHUB_REPOSITORY}"
          ls -lisah
          docker run --rm --entrypoint sh -v $(pwd):/app clamav/clamav:latest /app/clamdscan.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          persona: pedantic
  linux:
    name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
          make
          make test
  macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # GitHub's macOS runners use a paravirtual Metal device, so keep inference on the CPU.
      DOCS_GPU_LAYERS: 0
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build and Test
        run: |
          flags=(
            -DCMAKE_BUILD_RPATH="@loader_path"
            -DLLAMA_FATAL_WARNINGS=ON
            -DGGML_METAL_SHADER_DEBUG=ON
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
            -DCMAKE_C_FLAGS=-g
            -DCMAKE_CXX_FLAGS=-g
          )
          make CMAKE_FLAGS="${flags[*]}"

          show_crash_reports() {
            sleep 5
            for dir in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports"; do
              [[ -d "$dir" ]] || continue
              echo "Diagnostic reports in $dir:"
              ls -lt "$dir" | head -20
              for report in $(ls -t "$dir"/docs* 2>/dev/null | head -3); do
                echo "Crash report: $report"
                cat "$report"
              done
            done
          }

          # Run the first query under lldb so a crash gives us a backtrace.
          xcrun lldb --batch -o run -o "thread backtrace all" -- \
            ./build/release/docs "how to read a parquet file" 1 > /tmp/lldb.log 2>&1 || true
          if grep -q "stop reason = " /tmp/lldb.log; then
            cat /tmp/lldb.log
            show_crash_reports
            exit 1
          fi
          if ! make test CMAKE_FLAGS="${flags[*]}"; then
            cat /tmp/lldb.log
            show_crash_reports
            exit 1
          fi
  windows:
    name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    env:
      VULKAN_VERSION: 1.4.357.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -e
          curl.exe -L -o $RUNNER_TEMP/VulkanSDK-Installer.exe "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/windows/vulkansdk-windows-X64-${VULKAN_VERSION}.exe"
          status=0
          $RUNNER_TEMP/VulkanSDK-Installer.exe --accept-licenses --default-answer --confirm-command install || status=$?
          if [[ $status -ne 0 && $status -ne 3010 ]]; then
            echo "Vulkan SDK installer failed with exit code $status" >&2
            exit "$status"
          fi
          echo "VULKAN_SDK=C:\\VulkanSDK\\${VULKAN_VERSION}" >> "$GITHUB_ENV"
          echo "C:\\VulkanSDK\\${VULKAN_VERSION}\\bin" >> "$GITHUB_PATH"
      - name: Build and Test
        shell: bash
        run: |
          set -e
          # Git Bash puts its own MinGW runtime first, which does not match the
          # compiler used by the x64-windows-llvm toolchain.
          export PATH="/c/mingw64/bin:$PATH"
          make BUILD_DIR=build CMAKE_FLAGS="-G Ninja -DCMAKE_TOOLCHAIN_FILE=./third_party/llama.cpp/cmake/x64-windows-llvm.cmake -DLLAMA_BUILD_BORINGSSL=ON"
          make test BUILD_DIR=build CMAKE_FLAGS="-G Ninja -DCMAKE_TOOLCHAIN_FILE=./third_party/llama.cpp/cmake/x64-windows-llvm.cmake -DLLAMA_BUILD_BORINGSSL=ON"

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build & Analyze
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
          sudo apt-get install -y clang-format-20 clang-tidy-20
          clang-format-20 -i src/**/*.cpp src/**/*.hpp
          intercept-build-20 make
          run-clang-tidy-20 -p build/release -quiet -source-filter $(pwd)/src/

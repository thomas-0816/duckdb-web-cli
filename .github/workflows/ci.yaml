name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          persona: pedantic
  linux:
    name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MATRIX_OS: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build
        run: |
          if [[ "$MATRIX_OS" == "ubuntu-22.04" ]]; then
            wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update
            sudo apt-get install -y libvulkan-dev spirv-headers vulkan-sdk
          else
            sudo apt-get update
            sudo apt-get install -y libvulkan-dev spirv-headers glslc
          fi
          make
          make test
  macos:
    name: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build and Test
        run: |
          make
          xcrun lldb --batch \
            -o run \
            -o "thread backtrace all" \
            -- ./build/release/docs "how to read a parquet file" 1 > /tmp/lldb.log 2>&1 || true
          cat /tmp/lldb.log
          if grep -q "stop reason = " /tmp/lldb.log; then
            exit 1
          fi
          make test
  windows:
    name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
          - windows-11-arm
    env:
      VULKAN_VERSION: 1.4.357.0
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -e
          if [[ "$RUNNER_ARCH" == "ARM64" ]]; then
            sdk_os=warm
            sdk_arch=ARM64
          else
            sdk_os=windows
            sdk_arch=X64
          fi
          curl.exe -L -o "$RUNNER_TEMP/VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/${sdk_os}/vulkansdk-windows-${sdk_arch}-${VULKAN_VERSION}.exe"
          status=0
          $RUNNER_TEMP/VulkanSDK-Installer.exe --accept-licenses --default-answer --confirm-command install || status=$?
          if [[ $status -ne 0 && $status -ne 3010 ]]; then
            echo "Vulkan SDK installer failed with exit code $status" >&2
            exit "$status"
          fi
          echo "VULKAN_SDK=C:\\VulkanSDK\\${VULKAN_VERSION}" >> "$GITHUB_ENV"
          echo "C:\\VulkanSDK\\${VULKAN_VERSION}\\bin" >> "$GITHUB_PATH"
      # The MSVC STL in the VS 2026 image requires Clang 22, while the image
      # still ships LLVM 20. Install the matching LLVM like llama.cpp does.
      - name: Install LLVM
        if: runner.arch == 'X64'
        run: |
          choco install llvm --version=22.1.8
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Build and Test
        shell: bash
        run: |
          set -e
          # Git Bash puts its own MinGW runtime first, which does not match the
          # compiler used by the Windows LLVM toolchain.
          export PATH="/c/mingw64/bin:$PATH"
          make
          make test

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build & Analyze
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
          sudo apt-get install -y clang-format-20 clang-tidy-20
          clang-format-20 -i src/**/*.cpp src/**/*.hpp
          intercept-build-20 make
          run-clang-tidy-20 -p build/release -quiet -source-filter $(pwd)/src/

  pages-build:
    name: Pages build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage demo.mp4
        run: |
          mkdir -p _site
          cp demo.mp4 _site/demo.mp4
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  pages-deploy:
    name: Pages deploy
    needs: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write     # actions/deploy-pages
      id-token: write  # OIDC token for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          persona: pedantic
  linux:
    name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
          make
          make test

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build
        run: |
          brew install openssl@3
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          make
          make test

# TODO add build for windows-2022 and windows-2025 with vulkan

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Build & Analyze
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc spirv-headers
          sudo apt-get install -y clang-format-20 clang-tidy-20
          clang-format-20 -i src/**/*.cpp src/**/*.hpp
          intercept-build-20 make
          run-clang-tidy-20 -p build/release -quiet -j$(nproc) -source-filter $(pwd)/src/
